<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#8b1e3f"

    <title>今後の予定 | Camellia Portal</title>

    <link

        href="style.css"

</head>


<body>

<header class="app-header">

    <button

        class="menu-button"
        aria-label="メニューを開く"
        aria-expanded="false"

    <div class="header-title">
        <h1>Camellia Portal</h1>
    </div>

</header>


<div
    id="menuOverlay"
    class="menu-overlay"
></div>


<aside

    class="side-menu"

>

    <div class="side-menu-header">

        <button
            id="closeMenuButton"

    </div>


    <nav class="menu-list">

        <button
            class="menu-item"

        <button
            class="menu-item"

        <button
            class="menu-item"
            onclick="location.href='index.html'"
        >
            📅 カレンダー
        </button>

    </nav>

</aside>


<main class="app-main">

    <div class="page-title">

        <h2>
            今後の予定

        <p>
            今後予定されているZoomをご確認いただけます。

    </div>


    <section class="schedule-section">

    </section>

</main>


<script src="all-events.js"></script>

</body>

</html>
